<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinanceApp">
  <meta name="description" content="Gestion financiera personal - controla tus ingresos, gastos y presupuesto">
  <title>FinanceApp - Gestion Financiera Personal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--primary:#3b82f6;--primary-dark:#2563eb;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--purple:#8b5cf6;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-900);line-height:1.5;-webkit-tap-highlight-color:transparent}
    button{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
    input,select,textarea{font-family:inherit;font-size:16px}

    .auth-page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3b82f6,#8b5cf6);padding:20px}
    .auth-card{background:#fff;border-radius:16px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.15)}
    .auth-card h1{font-size:26px;font-weight:700;text-align:center;margin-bottom:4px}
    .auth-card .subtitle{text-align:center;color:var(--gray-500);margin-bottom:24px;font-size:14px}
    .auth-card .error{background:#fef2f2;color:var(--danger);padding:10px;border-radius:8px;margin-bottom:16px;font-size:14px}
    .auth-card .demo-info{margin-top:20px;padding:12px;background:var(--gray-50);border-radius:8px;text-align:center;font-size:13px;color:var(--gray-500)}
    .auth-card .demo-info strong{color:var(--gray-700)}

    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:14px;font-weight:500;color:var(--gray-700);margin-bottom:6px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid var(--gray-300);border-radius:10px;font-size:16px;outline:none;transition:border .2s;background:#fff}
    .form-group input:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:10px;font-weight:600;font-size:15px;border:none;transition:all .2s;min-height:44px}
    .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
    .btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#059669}
    .btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#dc2626}
    .btn-purple{background:var(--purple);color:#fff}.btn-purple:hover{background:#7c3aed}
    .btn-outline{background:transparent;border:1.5px solid var(--gray-300);color:var(--gray-700)}.btn-outline:hover{background:var(--gray-50)}
    .btn-sm{padding:8px 14px;font-size:13px;min-height:36px}
    .btn-block{width:100%}
    .link{color:var(--primary);text-decoration:none;font-weight:500}.link:hover{text-decoration:underline}

    .app-layout{display:flex;min-height:100vh;min-height:100dvh}
    .sidebar{width:260px;background:#fff;border-right:1px solid var(--gray-200);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .25s cubic-bezier(.4,0,.2,1)}
    .sidebar-header{padding:20px;border-bottom:1px solid var(--gray-200)}
    .sidebar-header h2{font-size:18px;font-weight:700}.sidebar-header p{font-size:12px;color:var(--gray-500)}
    .sidebar-nav{flex:1;padding:12px;overflow-y:auto}
    .sidebar-nav button{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;font-size:15px;border:none;background:transparent;color:var(--gray-600);text-align:left;transition:all .15s;min-height:48px}
    .sidebar-nav button:hover,.sidebar-nav button:active{background:var(--gray-100)}
    .sidebar-nav button.active{background:#eff6ff;color:var(--primary);font-weight:600}
    .sidebar-footer{padding:16px;border-top:1px solid var(--gray-200)}
    .sidebar-footer .user-info{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .sidebar-footer .avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
    .sidebar-footer .user-name{font-size:14px;font-weight:500}.sidebar-footer .user-email{font-size:12px;color:var(--gray-500)}
    .sidebar-footer .logout-btn{width:100%;text-align:left;padding:10px 16px;border:none;background:transparent;color:var(--danger);border-radius:8px;font-size:13px;min-height:40px}.sidebar-footer .logout-btn:hover{background:#fef2f2}

    .main-content{flex:1;margin-left:260px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
    .topbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
    .topbar .date{font-size:13px;color:var(--gray-500)}
    .page-content{padding:24px;flex:1;padding-bottom:100px}
    .mobile-menu-btn{display:none;background:none;border:none;padding:8px;font-size:24px;min-width:44px;min-height:44px}

    .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-200);z-index:50;padding:4px 0 env(safe-area-inset-bottom,4px)}
    .bottom-nav-inner{display:flex;justify-content:space-around}
    .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:none;background:transparent;color:var(--gray-400);font-size:10px;font-weight:500;min-width:56px;min-height:50px;border-radius:8px;transition:all .15s}
    .bottom-nav button .bnav-icon{font-size:22px;line-height:1}
    .bottom-nav button.active{color:var(--primary);background:#eff6ff}

    @media(max-width:768px){
      .sidebar{transform:translateX(-100%);width:280px}
      .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.15)}
      .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;backdrop-filter:blur(2px)}
      .main-content{margin-left:0}
      .mobile-menu-btn{display:flex}
      .bottom-nav{display:block}
      .page-content{padding:16px 12px;padding-bottom:calc(80px + env(safe-area-inset-bottom,16px))}
      .topbar{padding:12px 16px}
      .topbar .date{display:none}
      .stat-cards{grid-template-columns:1fr 1fr;gap:10px}
      .stat-card{padding:14px 12px}
      .stat-card .value{font-size:18px}
      .stat-card .label{font-size:12px}
      .grid-2{gap:16px}
      .card-header{padding:14px 16px}
      .card-body{padding:16px}
      .btn-sm{padding:8px 12px;font-size:12px}
      table{font-size:13px}
      th{padding:10px 10px;font-size:11px}
      td{padding:10px 10px}
      .modal{padding:20px;max-height:85vh;border-radius:20px 20px 0 0;position:fixed;bottom:0;left:0;right:0;max-width:100%;margin:0}
      .modal-overlay{align-items:flex-end;padding:0}
      .filter-bar{grid-template-columns:1fr 1fr;gap:8px}
      .pagination button{padding:8px 12px;min-width:40px}
      .flex-between{gap:8px}
      .auth-card{padding:24px 20px;border-radius:20px}
    }
    @media(max-width:380px){
      .stat-cards{grid-template-columns:1fr}
      .filter-bar{grid-template-columns:1fr}
    }

    .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
    .stat-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid var(--gray-300)}
    .stat-card.green{border-left-color:var(--success)}.stat-card.red{border-left-color:var(--danger)}
    .stat-card.blue{border-left-color:var(--primary)}.stat-card.purple{border-left-color:var(--purple)}
    .stat-card.orange{border-left-color:var(--warning)}
    .stat-card .label{font-size:13px;color:var(--gray-500);margin-bottom:2px}
    .stat-card .value{font-size:22px;font-weight:700}
    .stat-card .sub{font-size:12px;color:var(--gray-500);margin-top:2px}
    .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
    .card-header{padding:14px 16px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
    .card-header h2{font-size:15px;font-weight:600}
    .card-body{padding:16px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:768px){.grid-2{grid-template-columns:1fr}}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse;min-width:500px}
    th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;background:var(--gray-50);white-space:nowrap}
    td{padding:10px 12px;border-top:1px solid var(--gray-200);font-size:13px;white-space:nowrap}
    tr:hover{background:var(--gray-50)}
    .badge{display:inline-flex;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;white-space:nowrap}
    .badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}
    .badge-yellow{background:#fef3c7;color:#92400e}.badge-blue{background:#dbeafe;color:#1e40af}
    .badge-gray{background:var(--gray-100);color:var(--gray-600)}
    .progress-bar{width:100%;height:6px;background:var(--gray-200);border-radius:9999px;overflow:hidden}
    .progress-bar .fill{height:100%;border-radius:9999px;transition:width .3s}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
    .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .modal h2{font-size:18px;font-weight:700;margin-bottom:16px}
    .modal-actions{display:flex;gap:8px;margin-top:16px}
    .rec-item{padding:12px;border-radius:10px;margin-bottom:8px;font-size:13px;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
    .rec-item.info{background:#eff6ff;color:#1e40af}.rec-item.warn{background:#fffbeb;color:#92400e}
    .rec-item.danger{background:#fef2f2;color:#991b1b}.rec-item.success{background:#ecfdf5;color:#065f46}
    .chart-container{position:relative;height:260px}
    @media(max-width:768px){.chart-container{height:220px}}
    .empty-state{text-align:center;padding:40px 20px;color:var(--gray-400)}
    .empty-state .icon{font-size:48px;margin-bottom:12px}
    .flex-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .flex-gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .filter-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
    .pagination{display:flex;justify-content:center;gap:4px;margin-top:12px;flex-wrap:wrap}
    .pagination button{padding:6px 12px;border:1px solid var(--gray-300);border-radius:6px;background:#fff;font-size:13px;min-width:36px}
    .pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

    .install-banner{position:fixed;bottom:80px;left:12px;right:12px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;padding:16px;border-radius:14px;z-index:60;display:none;box-shadow:0 8px 24px rgba(59,130,246,.35);align-items:center;gap:12px}
    .install-banner.show{display:flex}
    .install-banner .ib-text{flex:1;font-size:14px;font-weight:500;line-height:1.3}
    .install-banner .ib-text small{display:block;font-weight:400;opacity:.85;font-size:12px;margin-top:2px}
    .install-banner .ib-btn{background:#fff;color:var(--primary);border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;white-space:nowrap;min-height:40px}
    .install-banner .ib-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:20px;padding:4px 8px}
    @media(min-width:769px){.install-banner{display:none!important}}
    .qp-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:1.5px solid var(--gray-200);border-radius:12px;background:#fff;cursor:pointer;transition:all .15s;min-height:60px}
    .qp-btn:hover,.qp-btn:active{border-color:var(--primary);background:#eff6ff}
    .qp-icon{font-size:24px;line-height:1}
    .qp-name{font-size:11px;font-weight:600;color:var(--gray-700);text-align:center;line-height:1.2}
    .qp-amt{font-size:10px;color:var(--gray-400)}
  </style>
</head>
<body>
  <div id="app"></div>
<script>
"use strict";

// ============ STORAGE ============
var DB = {
  get: function(k){ try{return JSON.parse(localStorage.getItem("fa_"+k)||"[]")}catch(e){return[]} },
  set: function(k,v){ localStorage.setItem("fa_"+k, JSON.stringify(v)); },
  getOne: function(k){ try{return JSON.parse(localStorage.getItem("fa_"+k))}catch(e){return null} },
  setOne: function(k,v){ localStorage.setItem("fa_"+k, JSON.stringify(v)); },
  genId: function(){ return Date.now().toString(36)+"-"+Math.random().toString(36).substr(2,9); }
};

// ============ DEFAULT CATEGORIES ============
var DEFAULT_EXPENSE = [
  {name:"Vivienda",icon:"\uD83C\uDFE0",color:"#3B82F6"},
  {name:"Alimentaci\u00f3n",icon:"\uD83D\uDED2",color:"#10B981"},
  {name:"Transporte",icon:"\uD83D\uDE97",color:"#F59E0B"},
  {name:"Combustible",icon:"\u26FD",color:"#EF4444"},
  {name:"Servicios b\u00e1sicos",icon:"\uD83D\uDCA1",color:"#8B5CF6"},
  {name:"Internet y telefon\u00eda",icon:"\uD83D\uDCF1",color:"#06B6D4"},
  {name:"Salud",icon:"\uD83C\uDFE5",color:"#EC4899"},
  {name:"Educaci\u00f3n",icon:"\uD83D\uDCDA",color:"#14B8A6"},
  {name:"Deudas",icon:"\uD83D\uDCB3",color:"#F97316"},
  {name:"Seguros",icon:"\uD83D\uDEE1\uFE0F",color:"#6366F1"},
  {name:"Entretenimiento",icon:"\uD83C\uDFAC",color:"#E11D48"},
  {name:"Compras personales",icon:"\uD83D\uDECD\uFE0F",color:"#A855F7"},
  {name:"Tecnolog\u00eda",icon:"\uD83D\uDCBB",color:"#2563EB"},
  {name:"Veh\u00edculo",icon:"\uD83D\uDD27",color:"#78716C"},
  {name:"Trabajo",icon:"\uD83D\uDCBC",color:"#059669"},
  {name:"Negocio",icon:"\uD83C\uDFE2",color:"#0891B2"},
  {name:"Familia",icon:"\uD83D\uDC68\u200D\uD83D\uDC69\u200D\uD83D\uDC67\u200D\uD83D\uDC66",color:"#DB2777"},
  {name:"Otros gastos",icon:"\uD83D\uDCE6",color:"#6B7280"}
];
var DEFAULT_INCOME = [
  {name:"Sueldo",icon:"\uD83D\uDCB0",color:"#10B981"},
  {name:"Trabajo independiente",icon:"\uD83C\uDFAF",color:"#3B82F6"},
  {name:"Negocio",icon:"\uD83C\uDFE2",color:"#8B5CF6"},
  {name:"Trabajo ocasional",icon:"\uD83D\uDCCB",color:"#F59E0B"},
  {name:"Otros ingresos",icon:"\uD83D\uDCB5",color:"#6B7280"}
];

// ============ HELPERS ============
function fmt(n){ return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n||0); }
function round2(n){ return Math.round(n*100)/100; }
function pct(a,b){ return b>0?(a/b)*100:0; }

// ============ AUTH ============
function registerUser(name, email, password){
  var users = DB.get("users");
  for(var i=0;i<users.length;i++){
    if(users[i].email===email) throw new Error("Email ya registrado");
  }
  var user = {id:DB.genId(), name:name, email:email, password:password, currency:"USD", created_at:new Date().toISOString()};
  users.push(user);
  DB.set("users", users);
  var cats = [];
  DEFAULT_EXPENSE.forEach(function(c){ cats.push({id:DB.genId(),name:c.name,icon:c.icon,color:c.color,type:"EXPENSE",user_id:user.id}); });
  DEFAULT_INCOME.forEach(function(c){ cats.push({id:DB.genId(),name:c.name,icon:c.icon,color:c.color,type:"INCOME",user_id:user.id}); });
  DB.set("categories_"+user.id, cats);
  createDemoData(user.id);
  var safeUser = {id:user.id,name:user.name,email:user.email,currency:user.currency};
  DB.setOne("current_user", safeUser);
  return safeUser;
}

function loginUser(email, password){
  var users = DB.get("users");
  for(var i=0;i<users.length;i++){
    if(users[i].email===email && users[i].password===password){
      var safeUser = {id:users[i].id,name:users[i].name,email:users[i].email,currency:users[i].currency};
      DB.setOne("current_user", safeUser);
      return safeUser;
    }
  }
  throw new Error("Email o contrase\u00f1a invalidos");
}

function getCurrentUser(){ return DB.getOne("current_user"); }
function doLogout(){ localStorage.removeItem("fa_current_user"); }

// ============ DEMO DATA ============
function createDemoData(userId){
  var accounts = [
    {id:DB.genId(),user_id:userId,name:"Banco Principal",type:"BANK",initial_balance:2000,current_balance:2450,currency:"USD"},
    {id:DB.genId(),user_id:userId,name:"Efectivo",type:"CASH",initial_balance:500,current_balance:320,currency:"USD"},
    {id:DB.genId(),user_id:userId,name:"Tarjeta de Cr\u00e9dito",type:"CREDIT_CARD",initial_balance:0,current_balance:-850,currency:"USD"}
  ];
  DB.set("accounts_"+userId, accounts);

  var cats = DB.get("categories_"+userId);
  var expCats = cats.filter(function(c){return c.type==="EXPENSE"});
  var incCats = cats.filter(function(c){return c.type==="INCOME"});
  var txs = [];
  var now = new Date();

  for(var m=0; m<6; m++){
    var d = new Date(now.getFullYear(), now.getMonth()-m, 1);
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var ym = d.getFullYear()+"-"+mm;

    var sal = findCat(incCats,"Sueldo");
    if(sal) txs.push(mkTx(userId,accounts[0].id,sal.id,"INCOME",1500+Math.random()*500,"Salario mensual",ym+"-01","NECESSARY",false,"PERSONAL"));

    var viv = findCat(expCats,"Vivienda");
    if(viv) txs.push(mkTx(userId,accounts[0].id,viv.id,"EXPENSE",400,"Alquiler",ym+"-05","NECESSARY",true,"PERSONAL"));

    var ali = findCat(expCats,"Alimentaci\u00f3n");
    if(ali) for(var i=0;i<8;i++) txs.push(mkTx(userId,accounts[1].id,ali.id,"EXPENSE",25+Math.random()*40,"Supermercado",ym+"-"+String(3+i*3).padStart(2,"0"),"NECESSARY",false,"PERSONAL"));

    var tra = findCat(expCats,"Transporte");
    if(tra) txs.push(mkTx(userId,accounts[1].id,tra.id,"EXPENSE",80+Math.random()*40,"Transporte mensual",ym+"-10","NECESSARY",false,"PERSONAL"));

    var ser = findCat(expCats,"Servicios b\u00e1sicos");
    if(ser) txs.push(mkTx(userId,accounts[0].id,ser.id,"EXPENSE",60+Math.random()*30,"Servicios p\u00fablicos",ym+"-15","NECESSARY",true,"PERSONAL"));

    var ent = findCat(expCats,"Entretenimiento");
    if(ent) txs.push(mkTx(userId,accounts[2].id,ent.id,"EXPENSE",50+Math.random()*100,"Cine y ocio",ym+"-20","DISCRETIONARY",false,"PERSONAL"));

    var net = findCat(expCats,"Internet y telefon\u00eda");
    if(net) txs.push(mkTx(userId,accounts[0].id,net.id,"EXPENSE",45,"Internet y m\u00f3vil",ym+"-08","NECESSARY",true,"PERSONAL"));

    if(m%2===0){
      var sal2 = findCat(expCats,"Salud");
      if(sal2) txs.push(mkTx(userId,accounts[0].id,sal2.id,"EXPENSE",30+Math.random()*50,"Farmacia",ym+"-12","NECESSARY",false,"PERSONAL"));
    }

    var negI = findCat(incCats,"Negocio");
    if(negI && m<3) txs.push(mkTx(userId,accounts[0].id,negI.id,"INCOME",200+Math.random()*300,"Ventas negocio",ym+"-25","NECESSARY",false,"BUSINESS"));

    var negE = findCat(expCats,"Negocio");
    if(negE && m<3) txs.push(mkTx(userId,accounts[2].id,negE.id,"EXPENSE",100+Math.random()*150,"Suministros negocio",ym+"-18","BUSINESS",false,"BUSINESS"));

    var comp = findCat(expCats,"Compras personales");
    if(comp) for(var j=0;j<5;j++) txs.push(mkTx(userId,accounts[1].id,comp.id,"EXPENSE",3+Math.random()*7,"Compra peque\u00f1a",ym+"-"+String(5+j*4).padStart(2,"0"),"DISCRETIONARY",false,"PERSONAL"));
  }

  var budgets = [];
  var bAl = findCat(expCats,"Alimentaci\u00f3n");
  var bTr = findCat(expCats,"Transporte");
  var bEn = findCat(expCats,"Entretenimiento");
  var bVi = findCat(expCats,"Vivienda");
  if(bAl) budgets.push({id:DB.genId(),user_id:userId,category_id:bAl.id,month:now.getMonth()+1,year:now.getFullYear(),amount:350,warning_threshold:80});
  if(bTr) budgets.push({id:DB.genId(),user_id:userId,category_id:bTr.id,month:now.getMonth()+1,year:now.getFullYear(),amount:150,warning_threshold:80});
  if(bEn) budgets.push({id:DB.genId(),user_id:userId,category_id:bEn.id,month:now.getMonth()+1,year:now.getFullYear(),amount:150,warning_threshold:80});
  if(bVi) budgets.push({id:DB.genId(),user_id:userId,category_id:bVi.id,month:now.getMonth()+1,year:now.getFullYear(),amount:450,warning_threshold:80});
  DB.set("budgets_"+userId, budgets);

  setSalary(userId, {amount:2000});
  setCreditCards(userId, [
    {id:DB.genId(),name:"Visa Platinum",total_debt:1200,minimum_payment:80,due_date:15,interest_rate:3.5},
    {id:DB.genId(),name:"Mastercard Gold",total_debt:450,minimum_payment:35,due_date:22,interest_rate:2.8}
  ]);

}

function findCat(cats,name){
  for(var i=0;i<cats.length;i++){if(cats[i].name===name)return cats[i];}
  return null;
}
function mkTx(uid,aid,cid,type,amt,desc,date,cls,rec,biz){
  return {id:DB.genId(),user_id:uid,account_id:aid,category_id:cid,type:type,amount:Math.round(amt*100)/100,description:desc,date:date,classification:cls,is_recurring:rec,is_business:biz};
}

// ============ FINANCIAL ENGINE ============

function getSalary(userId){ return DB.getOne("salary_"+userId) || {amount:0}; }
function setSalary(userId, data){ DB.setOne("salary_"+userId, data); }
function getCreditCards(userId){ return DB.get("credit_cards_"+userId); }
function setCreditCards(userId, cards){ DB.set("credit_cards_"+userId, cards); }
function getQuickExpenses(userId){ var q=DB.getOne("quick_expenses_"+userId); return Array.isArray(q)?q:[]; }
function setQuickExpenses(userId, q){ DB.setOne("quick_expenses_"+userId, q); }

function getMonthTxs(userId, month, year, type){
  var txs = DB.get("transactions_"+userId);
  return txs.filter(function(t){
    var parts = t.date.split("-");
    var tm = parseInt(parts[1],10);
    var ty = parseInt(parts[0],10);
    if(tm!==month || ty!==year) return false;
    if(type && t.type!==type) return false;
    return true;
  });
}
function sumAmount(txs){
  var s=0;
  for(var i=0;i<txs.length;i++) s+=Number(txs[i].amount);
  return s;
}

function getDashboardData(userId, month, year){
  var incomes = getMonthTxs(userId,month,year,"INCOME");
  var expenses = getMonthTxs(userId,month,year,"EXPENSE");
  var totalInc = sumAmount(incomes);
  var totalExp = sumAmount(expenses);
  var balance = totalInc - totalExp;
  var savingsRate = pct(balance, totalInc);

  var cats = DB.get("categories_"+userId);
  var expByCat = {};
  for(var i=0;i<expenses.length;i++){
    var cid = expenses[i].category_id;
    expByCat[cid] = (expByCat[cid]||0) + Number(expenses[i].amount);
  }
  var distribution = [];
  for(var catId in expByCat){
    var cat = null;
    for(var j=0;j<cats.length;j++){if(cats[j].id===catId){cat=cats[j];break;}}
    distribution.push({name:cat?cat.name:"?",amount:expByCat[catId],color:cat?cat.color:"#6B7280",icon:cat?cat.icon:""});
  }
  distribution.sort(function(a,b){return b.amount-a.amount;});

  var monthlyTrend = [];
  var now = new Date();
  for(var k=5;k>=0;k--){
    var md = new Date(now.getFullYear(), now.getMonth()-k, 1);
    var m2=md.getMonth()+1, y2=md.getFullYear();
    var inc=sumAmount(getMonthTxs(userId,m2,y2,"INCOME"));
    var exp=sumAmount(getMonthTxs(userId,m2,y2,"EXPENSE"));
    monthlyTrend.push({month:md.toLocaleDateString("es",{month:"short",year:"2-digit"}),income:inc,expenses:exp,savings:inc-exp});
  }

  var smallExpenses = expenses.filter(function(t){return Number(t.amount)<10;});
  var recommendations = [];
  if(totalExp>totalInc) recommendations.push({type:"danger",text:"Tus gastos superaron tus ingresos este per\u00edodo."});
  if(savingsRate<10 && totalInc>0) recommendations.push({type:"warn",text:"Tu tasa de ahorro es "+savingsRate.toFixed(1)+"%. Intenta reducir gastos discrecionales."});
  for(var di=0;di<distribution.length;di++){
    if(totalInc>0 && (distribution[di].amount/totalInc)*100>30){
      recommendations.push({type:"info",text:"\""+distribution[di].name+"\" representa el "+Math.round((distribution[di].amount/totalInc)*100)+"% de tus ingresos. Revisa si puede reducirse."});
    }
  }
  if(smallExpenses.length>5){
    var smallTotal=0;
    for(var si=0;si<smallExpenses.length;si++) smallTotal+=Number(smallExpenses[si].amount);
    recommendations.push({type:"warn",text:smallExpenses.length+" gastos peque\u00f1os sumaron "+fmt(smallTotal)+". Aunque cada uno es peque\u00f1o, en conjunto son significativos."});
  }
  if(recommendations.length===0 && totalInc>0) recommendations.push({type:"success",text:"Tu situaci\u00f3n financiera se ve saludable. \u00a1Sigue as\u00ed!"});

  var smallTotal2=0;
  for(var si2=0;si2<smallExpenses.length;si2++) smallTotal2+=Number(smallExpenses[si2].amount);

  return {totalIncome:totalInc,totalExpenses:totalExp,balance:balance,savingsRate:round2(savingsRate),distribution:distribution,monthlyTrend:monthlyTrend,recommendations:recommendations,smallExpenses:{count:smallExpenses.length,total:smallTotal2}};
}

function getAnalysisData(userId, month, year){
  var data = getDashboardData(userId, month, year);
  var txs = getMonthTxs(userId, month, year, "EXPENSE");
  var totalFixed=0;
  for(var i=0;i<txs.length;i++){if(txs[i].is_recurring) totalFixed+=Number(txs[i].amount);}
  var totalVariable = data.totalExpenses - totalFixed;

  var cats = DB.get("categories_"+userId);
  var distribution = [];
  for(var di=0;di<data.distribution.length;di++){
    var d = data.distribution[di];
    var catTxs = txs.filter(function(t){
      for(var ci=0;ci<cats.length;ci++){
        if(cats[ci].id===t.category_id && cats[ci].name===d.name) return true;
      }
      return false;
    });
    distribution.push({
      name:d.name,amount:d.amount,color:d.color,icon:d.icon,
      percentageOfExpenses:pct(d.amount,data.totalExpenses),
      percentageOfIncome:pct(d.amount,data.totalIncome),
      transactionCount:catTxs.length
    });
  }

  var unusualExpenses = [];
  var now = new Date();
  for(var ui=0;ui<distribution.length;ui++){
    var cat = distribution[ui];
    var histAmounts = [];
    for(var hi=1;hi<=3;hi++){
      var hd=new Date(now.getFullYear(),now.getMonth()-hi,1);
      var hTxs=getMonthTxs(userId,hd.getMonth()+1,hd.getFullYear(),"EXPENSE");
      var hCats=DB.get("categories_"+userId);
      var catId2=null;
      for(var hc=0;hc<hCats.length;hc++){if(hCats[hc].name===cat.name){catId2=hCats[hc].id;break;}}
      var amt=0;
      for(var ht=0;ht<hTxs.length;ht++){if(hTxs[ht].category_id===catId2) amt+=Number(hTxs[ht].amount);}
      if(amt>0) histAmounts.push(amt);
    }
    if(histAmounts.length>=2){
      var avg=0;
      for(var ai=0;ai<histAmounts.length;ai++) avg+=histAmounts[ai];
      avg=avg/histAmounts.length;
      if(cat.amount>avg*1.2){
        unusualExpenses.push({category:cat.name,current:cat.amount,average:avg,percentage:Math.round(((cat.amount-avg)/avg)*100),message:"Gasto "+Math.round(((cat.amount-avg)/avg)*100)+"% por encima del promedio hist\u00f3rico"});
      }
    }
  }

  return {totalIncome:data.totalIncome,totalExpenses:data.totalExpenses,balance:data.balance,savingsRate:data.savingsRate,totalFixed:totalFixed,totalVariable:totalVariable,availableBeforeVariable:data.totalIncome-totalFixed,distribution:distribution,monthlyTrend:data.monthlyTrend,recommendations:data.recommendations,smallExpenses:data.smallExpenses,unusualExpenses:unusualExpenses};
}

function getBudgetData(userId, month, year){
  var budgets = DB.get("budgets_"+userId).filter(function(b){return b.month===month && b.year===year;});
  var cats = DB.get("categories_"+userId);
  var result = [];
  for(var i=0;i<budgets.length;i++){
    var b = budgets[i];
    var cat=null;
    for(var j=0;j<cats.length;j++){if(cats[j].id===b.category_id){cat=cats[j];break;}}
    var txs=getMonthTxs(userId,month,year,"EXPENSE");
    var spent=0;
    for(var k=0;k<txs.length;k++){if(txs[k].category_id===b.category_id) spent+=Number(txs[k].amount);}
    var percentage=b.amount>0?(spent/b.amount)*100:0;
    var status="NORMAL";
    if(percentage>=100) status="EXCEEDED";
    else if(percentage>=b.warning_threshold) status="WARNING";
    result.push({id:b.id,category_id:b.category_id,month:b.month,year:b.year,amount:b.amount,warning_threshold:b.warning_threshold,category:cat,spent:spent,available:b.amount-spent,percentage:round2(percentage),status:status});
  }
  return result;
}

function makePeriodSelector(){
  var opts = "";
  for(var i=0;i<12;i++){
    var d = new Date();
    d.setMonth(d.getMonth()-i);
    var m=d.getMonth()+1, y=d.getFullYear();
    var sel = (m===currentPeriod.month && y===currentPeriod.year) ? "selected" : "";
    opts += '<option value="'+m+'-'+y+'" '+sel+'>'+d.toLocaleDateString("es",{month:"long",year:"numeric"})+'</option>';
  }
  return '<select onchange="var parts=this.value.split(\'-\');currentPeriod={month:parseInt(parts[0]),year:parseInt(parts[1])};renderPage(getCurrentUser())">'+opts+'</select>';
}

function renderRecs(recs){

function deleteCreditCard(id){
  if(!confirm("\u00bfEliminar esta tarjeta?")) return;
  var user = getCurrentUser();
  var cards = getCreditCards(user.id);
  var newCards = [];
  for(var i=0;i<cards.length;i++){if(cards[i].id!==id) newCards.push(cards[i]);}
  setCreditCards(user.id, newCards);
  var m = document.getElementById("cc-modal");
  if(m) m.remove();
  renderPage(user);
}

var txFilter = {type:"",category_id:"",account_id:"",search:"",page:1};

function renderTransactions(user){
  var txs = DB.get("transactions_"+user.id);
  var cats = DB.get("categories_"+user.id);
  var accs = DB.get("accounts_"+user.id);

  var filtered = txs.filter(function(t){
    var parts = t.date.split("-");
    var tm = parseInt(parts[1],10);
    var ty = parseInt(parts[0],10);
    if(tm!==currentPeriod.month || ty!==currentPeriod.year) return false;
    if(txFilter.type && t.type!==txFilter.type) return false;
    if(txFilter.category_id && t.category_id!==txFilter.category_id) return false;
    if(txFilter.account_id && t.account_id!==txFilter.account_id) return false;
    if(txFilter.search && t.description.toLowerCase().indexOf(txFilter.search.toLowerCase())===-1) return false;
    return true;
  });
  filtered.sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  var perPage=15; var totalPages=Math.ceil(filtered.length/perPage);
  var pageTxs = filtered.slice((txFilter.page-1)*perPage, txFilter.page*perPage);

  var catOpts = '<option value="">Todas las categor\u00edas</option>';
  for(var ci=0;ci<cats.length;ci++){
    catOpts += '<option value="'+cats[ci].id+'" '+(txFilter.category_id===cats[ci].id?"selected":"")+'>'+cats[ci].icon+" "+cats[ci].name+'</option>';
  }
  var accOpts = '<option value="">Todas las cuentas</option>';
  for(var ai=0;ai<accs.length;ai++){
    accOpts += '<option value="'+accs[ai].id+'" '+(txFilter.account_id===accs[ai].id?"selected":"")+'>'+accs[ai].name+'</option>';
  }

  var rows = "";
  if(pageTxs.length===0){
    rows = '<tr><td colspan="7" style="text-align:center;color:var(--gray-400);padding:32px">No hay movimientos</td></tr>';
  }
  for(var ri=0;ri<pageTxs.length;ri++){
    var t = pageTxs[ri];
    var cat=null,acc=null;
    for(var ci2=0;ci2<cats.length;ci2++){if(cats[ci2].id===t.category_id){cat=cats[ci2];break;}}
    for(var ai2=0;ai2<accs.length;ai2++){if(accs[ai2].id===t.account_id){acc=accs[ai2];break;}}
    var typeBadge = t.type==="INCOME" ? '<span class="badge badge-green">Ingreso</span>' : '<span class="badge badge-red">Gasto</span>';
    var bizBadge = t.is_business==="BUSINESS" ? ' <span class="badge badge-yellow">Negocio</span>' : '';
    rows += '<tr><td>'+new Date(t.date).toLocaleDateString("es")+'</td><td>'+t.description+'</td>'+
    '<td>'+typeBadge+bizBadge+'</td>'+
    '<td><span class="badge badge-blue">'+(cat?cat.icon+" "+cat.name:"?")+'</span></td>'+
    '<td>'+(acc?acc.name:"?")+'</td>'+
    '<td style="text-align:right;font-weight:600;color:'+(t.type==="INCOME"?"var(--success)":"var(--danger)")+'">'+(t.type==="INCOME"?"+":"-")+fmt(t.amount)+'</td>'+
    '<td style="text-align:center"><button class="btn btn-outline btn-sm" onclick="editTx(\''+t.id+'\')" style="margin-right:4px">\u270F\uFE0F</button><button class="btn btn-outline btn-sm" onclick="deleteTx(\''+t.id+'\')">\uD83D\uDDD1\uFE0F</button></td></tr>';
  }

  var pagHtml = "";
  if(totalPages>1){
    pagHtml = '<div class="pagination">';
    for(var pi=1;pi<=totalPages;pi++){
      pagHtml += '<button class="'+(txFilter.page===pi?"active":"")+'" onclick="txFilter.page='+pi+';renderTransactions(getCurrentUser())">'+pi+'</button>';
    }
    pagHtml += '</div>';
  }

  var txCount = txs.length;
  document.getElementById("page-content").innerHTML =
    '<div class="flex-between" style="margin-bottom:24px">'+
    '<div class="flex-gap"><h1 style="font-size:24px;font-weight:700">Movimientos</h1>'+makePeriodSelector()+'</div>'+
    '<div class="flex-gap">'+
    '<button class="btn btn-primary btn-sm" onclick="openTxForm(\'INCOME\')">+ Nuevo Movimiento</button>'+
    (txCount>0?'<button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="deleteAllTx()">Borrar todo</button>':'')+
    '</div></div>'+
    '<div class="card" style="margin-bottom:16px"><div class="card-body"><div class="filter-bar">'+
    '<input type="text" placeholder="Buscar..." value="'+txFilter.search+'" oninput="txFilter.search=this.value;txFilter.page=1;renderTransactions(getCurrentUser())">'+
    '<select onchange="txFilter.type=this.value;txFilter.page=1;renderTransactions(getCurrentUser())"><option value="">Todos los tipos</option><option value="INCOME" '+(txFilter.type==="INCOME"?"selected":"")+'>Ingresos</option><option value="EXPENSE" '+(txFilter.type==="EXPENSE"?"selected":"")+'>Gastos</option></select>'+
    catOpts.replace('<option value="">Todas las categor','<select onchange="txFilter.category_id=this.value;txFilter.page=1;renderTransactions(getCurrentUser())"><option value="">Todas las categor')+
    '</select>'+
    accOpts.replace('<option value="">Todas las cuentas','<select onchange="txFilter.account_id=this.value;txFilter.page=1;renderTransactions(getCurrentUser())"><option value="">Todas las cuentas')+
    '</select>'+
    '</div></div></div>'+
    '<div class="card"><div class="table-wrap"><table>'+
    '<thead><tr><th>Fecha</th><th>Descripci\u00f3n</th><th>Tipo</th><th>Categor\u00eda</th><th>Cuenta</th><th style="text-align:right">Monto</th><th style="text-align:center">Acciones</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>'+pagHtml+'</div>';
}

function onTxTypeChange(type){
  var labels = document.querySelectorAll("#tx-modal label[style]");
  for(var i=0;i<labels.length;i++){
    if(labels[i].querySelector('input[name="tf-type"]')){
      var input = labels[i].querySelector('input[name="tf-type"]');
      var isActive = input.value === type;
      labels[i].style.borderColor = isActive ? (type==="INCOME"?"var(--success)":"var(--danger)") : "var(--gray-300)";
      labels[i].style.color = isActive ? (type==="INCOME"?"var(--success)":"var(--danger)") : "var(--gray-500)";
    }
  }
  var catSelect = document.getElementById("tf-cat");
  if(!catSelect) return;
  var selectedVal = catSelect.value;
  var allOpts = catSelect.options;
  var hasVisible = false;
  var firstVisible = null;
  for(var j=0;j<allOpts.length;j++){
    if(j===0) continue;
    var optType = allOpts[j].getAttribute("data-type");
    var show = (optType === type);
    allOpts[j].style.display = show ? "" : "none";
    if(show && !firstVisible) firstVisible = allOpts[j].value;
    if(allOpts[j].value === selectedVal && show) hasVisible = true;
  }
  if(!hasVisible && firstVisible) catSelect.value = firstVisible;
}

function onTxCatChange(){
  var catSelect = document.getElementById("tf-cat");
  if(!catSelect) return;
  var opt = catSelect.options[catSelect.selectedIndex];
  if(opt && opt.getAttribute("data-type")){
    var type = opt.getAttribute("data-type");
    var radio = document.querySelector('input[name="tf-type"][value="'+type+'"]');
    if(radio && !radio.checked){
      radio.checked = true;
      onTxTypeChange(type);
    }
  }
}

function recalcBalances(userId){
  var accs=DB.get("accounts_"+userId);
  var txs=DB.get("transactions_"+userId);
  for(var a=0;a<accs.length;a++){
    var bal=Number(accs[a].initial_balance||0);
    for(var t=0;t<txs.length;t++){
      if(txs[t].account_id===accs[a].id){
        if(txs[t].type==="INCOME") bal+=Number(txs[t].amount);
        else if(txs[t].type==="EXPENSE") bal-=Number(txs[t].amount);
      }
    }
    accs[a].current_balance=Math.round(bal*100)/100;
  }
  DB.set("accounts_"+userId,accs);
}

    var toId=document.getElementById("tfr-to").value;
    var amount=parseFloat(document.getElementById("tfr-amount").value);
    if(fromId===toId){alert("Selecciona cuentas diferentes");return;}
    var from=null,to=null;
    for(var i=0;i<accs.length;i++){
      if(accs[i].id===fromId)from=accs[i];
      if(accs[i].id===toId)to=accs[i];

  document.getElementById("bud-form").onsubmit=function(e){
    e.preventDefault();var user=getCurrentUser();var budgets=DB.get("budgets_"+user.id);
    budgets.push({id:DB.genId(),user_id:user.id,category_id:document.getElementById("bf-cat").value,month:currentPeriod.month,year:currentPeriod.year,amount:parseFloat(document.getElementById("bf-amount").value),warning_threshold:parseFloat(document.getElementById("bf-warn").value)||80});
    DB.set("budgets_"+user.id,budgets);document.getElementById("bud-modal").remove();renderPage(user);
  };
}
function deleteBudget(id){
  if(!confirm("\u00bfEliminar?"))return;
  var user=getCurrentUser();var budgets=DB.get("budgets_"+user.id);var newB=[];
  for(var i=0;i<budgets.length;i++){if(budgets[i].id!==id)newB.push(budgets[i]);}
  DB.set("budgets_"+user.id,newB);renderPage(user);
}

// ============ ANALYSIS PAGE ============
function renderAnalysis(user){
  var d=getAnalysisData(user.id,currentPeriod.month,currentPeriod.year);
  var sal=getSalary(user.id);
  var salPct = sal.amount>0?Math.round((d.totalExpenses/sal.amount)*100):0;
  var el=document.getElementById("page-content");
  el.innerHTML =
    '<div class="flex-between" style="margin-bottom:24px">'+
    '<h1 style="font-size:24px;font-weight:700">An\u00e1lisis Financiero</h1>'+
    makePeriodSelector()+'</div>'+
    '<div class="stat-cards">'+
    '<div class="stat-card orange"><div class="label">Gastos Fijos</div><div class="value" style="color:var(--warning)">'+fmt(d.totalFixed)+'</div><div class="sub">'+(d.totalIncome>0?Math.round((d.totalFixed/d.totalIncome)*100):0)+'% de ingresos</div></div>'+
    '<div class="stat-card blue"><div class="label">Gastos Variables</div><div class="value">'+fmt(d.totalVariable)+'</div></div>'+
    '<div class="stat-card green"><div class="label">Disponible antes de variables</div><div class="value" style="color:'+(d.availableBeforeVariable>=0?"var(--success)":"var(--danger)")+'">'+fmt(d.availableBeforeVariable)+'</div></div>'+
    (sal.amount>0?'<div class="stat-card '+(salPct>100?"red":"green")+'"><div class="label">Gastos / Sueldo</div><div class="value" style="color:'+(salPct>100?"var(--danger)":"var(--success)")+'">'+salPct+'%</div><div class="sub">'+fmt(d.totalExpenses)+' de '+fmt(sal.amount)+'</div></div>':'')+
    '</div>'+
    '<div class="grid-2" style="margin-bottom:24px">'+
    '<div class="card"><div class="card-header"><h2>Distribuci\u00f3n de Gastos</h2></div><div class="card-body"><div class="chart-container"><canvas id="ana-pie"></canvas></div></div></div>'+
    '<div class="card"><div class="card-header"><h2>Evoluci\u00f3n Mensual</h2></div><div class="card-body"><div class="chart-container"><canvas id="ana-line"></canvas></div></div></div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:24px"><div class="card-header"><h2>Gastos por Categor\u00eda (% de ingresos)</h2></div><div class="card-body"><div class="chart-container" style="height:400px"><canvas id="ana-bar"></canvas></div></div></div>'+
    '<div class="card" style="margin-bottom:24px"><div class="card-header"><h2>Detalle por Categor\u00eda</h2></div><div class="table-wrap"><table>'+
    '<thead><tr><th>Categor\u00eda</th><th style="text-align:right">Monto</th><th style="text-align:right">% Gastos</th><th style="text-align:right">% Ingresos</th><th style="text-align:center">Transacciones</th></tr></thead>'+
    '<tbody>'+
    (function(){var h="";for(var i=0;i<d.distribution.length;i++){var c=d.distribution[i];h+='<tr><td><span style="margin-right:8px">'+c.icon+'</span>'+c.name+'</td><td style="text-align:right;font-weight:600">'+fmt(c.amount)+'</td><td style="text-align:right">'+c.percentageOfExpenses.toFixed(1)+'%</td><td style="text-align:right;'+(c.percentageOfIncome>30?"color:var(--danger);font-weight:700":"")+'">'+c.percentageOfIncome.toFixed(1)+'%</td><td style="text-align:center;color:var(--gray-500)">'+c.transactionCount+'</td></tr>';}return h;})()+
    '</tbody></table></div></div>'+
    (d.unusualExpenses.length>0?'<div class="card"><div class="card-header"><h2>Gastos Inusuales Detectados</h2></div><div class="card-body">'+
    (function(){var h="";for(var i=0;i<d.unusualExpenses.length;i++){var a=d.unusualExpenses[i];h+='<div class="rec-item danger"><span>\u26A0\uFE0F</span><div><strong>'+fmt(a.current)+' este mes vs promedio de '+fmt(a.average)+'</strong><br><span style="font-size:13px">'+a.message+'</span></div></div>';}return h;})()+
    '</div></div>':'');

  if(d.distribution.length>0){
    var pie=new Chart(document.getElementById("ana-pie"),{type:"doughnut",data:{labels:d.distribution.map(function(c){return c.name}),datasets:[{data:d.distribution.map(function(c){return c.amount}),backgroundColor:d.distribution.map(function(c){return c.color})}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{boxWidth:12,padding:6,font:{size:11}}},tooltip:{callbacks:{label:function(ctx){return ctx.label+": "+fmt(ctx.raw)}}}}}});
    chartInstances.push(pie);
  }
  var line=new Chart(document.getElementById("ana-line"),{type:"line",data:{labels:d.monthlyTrend.map(function(m){return m.month}),datasets:[{label:"Ingresos",data:d.monthlyTrend.map(function(m){return m.income}),borderColor:"#10B981",tension:.3},{label:"Gastos",data:d.monthlyTrend.map(function(m){return m.expenses}),borderColor:"#EF4444",tension:.3},{label:"Ahorro",data:d.monthlyTrend.map(function(m){return m.savings}),borderColor:"#3B82F6",tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+": "+fmt(ctx.raw)}}}}}});
  chartInstances.push(line);
  var bar=new Chart(document.getElementById("ana-bar"),{type:"bar",data:{labels:d.distribution.map(function(c){return c.name}),datasets:[{label:"% de Ingresos",data:d.distribution.map(function(c){return c.percentageOfIncome}),backgroundColor:d.distribution.map(function(c){return c.color})}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:function(ctx){return ctx.raw.toFixed(1)+"%"}}}},scales:{x:{max:100,ticks:{callback:function(v){return v+"%"}}}}}});
  chartInstances.push(bar);
}

// ============ INIT ============
render();

// ============ PWA ============
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js").catch(function(){});
}

var deferredPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredPrompt = e;
  if(localStorage.getItem("fa_install_dismissed")!=="1"){
    setTimeout(function(){
      var banner = document.getElementById("install-banner");
      if(banner) banner.classList.add("show");
    }, 3000);
  }
});

document.addEventListener("click", function(e){
  if(e.target && e.target.id==="install-btn" && deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt=null; var b=document.getElementById("install-banner");if(b)b.classList.remove("show"); });
  }
});

function dismissInstall(){
  localStorage.setItem("fa_install_dismissed","1");
  var b=document.getElementById("install-banner");if(b)b.classList.remove("show");
}

window.addEventListener("appinstalled", function(){ deferredPrompt=null; dismissInstall(); });
</script>
