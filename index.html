<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceApp - Gestión Financiera Personal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--primary:#3b82f6;--primary-dark:#2563eb;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--purple:#8b5cf6;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-900);line-height:1.5}
    button{cursor:pointer;font-family:inherit}
    input,select,textarea{font-family:inherit}

    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3b82f6,#8b5cf6);padding:20px}
    .auth-card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.15)}
    .auth-card h1{font-size:28px;font-weight:700;text-align:center;margin-bottom:4px}
    .auth-card .subtitle{text-align:center;color:var(--gray-500);margin-bottom:24px}
    .auth-card .error{background:#fef2f2;color:var(--danger);padding:10px;border-radius:8px;margin-bottom:16px;font-size:14px}
    .auth-card .demo-info{margin-top:20px;padding:12px;background:var(--gray-50);border-radius:8px;text-align:center;font-size:13px;color:var(--gray-500)}
    .auth-card .demo-info strong{color:var(--gray-700)}

    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:14px;font-weight:500;color:var(--gray-700);margin-bottom:4px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1px solid var(--gray-300);border-radius:8px;font-size:14px;outline:none;transition:border .2s}
    .form-group input:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;border:none;transition:all .2s}
    .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
    .btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#059669}
    .btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#dc2626}
    .btn-purple{background:var(--purple);color:#fff}.btn-purple:hover{background:#7c3aed}
    .btn-outline{background:transparent;border:1px solid var(--gray-300);color:var(--gray-700)}.btn-outline:hover{background:var(--gray-50)}
    .btn-sm{padding:6px 12px;font-size:13px}
    .btn-block{width:100%}
    .link{color:var(--primary);text-decoration:none;font-weight:500}.link:hover{text-decoration:underline}

    .app-layout{display:flex;min-height:100vh}
    .sidebar{width:260px;background:#fff;border-right:1px solid var(--gray-200);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .2s}
    .sidebar-header{padding:24px;border-bottom:1px solid var(--gray-200)}
    .sidebar-header h2{font-size:18px;font-weight:700}.sidebar-header p{font-size:12px;color:var(--gray-500)}
    .sidebar-nav{flex:1;padding:16px;overflow-y:auto}
    .sidebar-nav button{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;font-size:14px;border:none;background:transparent;color:var(--gray-600);text-align:left;transition:all .15s}
    .sidebar-nav button:hover{background:var(--gray-100)}
    .sidebar-nav button.active{background:#eff6ff;color:var(--primary);font-weight:600}
    .sidebar-footer{padding:16px;border-top:1px solid var(--gray-200)}
    .sidebar-footer .user-info{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .sidebar-footer .avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
    .sidebar-footer .user-name{font-size:14px;font-weight:500}.sidebar-footer .user-email{font-size:12px;color:var(--gray-500)}
    .sidebar-footer .logout-btn{width:100%;text-align:left;padding:8px 16px;border:none;background:transparent;color:var(--danger);border-radius:8px;font-size:13px}.sidebar-footer .logout-btn:hover{background:#fef2f2}

    .main-content{flex:1;margin-left:260px;display:flex;flex-direction:column;min-height:100vh}
    .topbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
    .topbar .date{font-size:13px;color:var(--gray-500)}
    .page-content{padding:32px;flex:1}

    .mobile-menu-btn{display:none;background:none;border:none;padding:8px}
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%)}
      .sidebar.open{transform:translateX(0)}
      .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
      .main-content{margin-left:0}
      .mobile-menu-btn{display:block}
      .page-content{padding:16px}
    }

    .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid var(--gray-300)}
    .stat-card.green{border-left-color:var(--success)}.stat-card.red{border-left-color:var(--danger)}
    .stat-card.blue{border-left-color:var(--primary)}.stat-card.purple{border-left-color:var(--purple)}
    .stat-card.orange{border-left-color:var(--warning)}
    .stat-card .label{font-size:13px;color:var(--gray-500);margin-bottom:4px}
    .stat-card .value{font-size:24px;font-weight:700}
    .stat-card .sub{font-size:12px;color:var(--gray-500);margin-top:4px}

    .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
    .card-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
    .card-header h2{font-size:16px;font-weight:600}
    .card-body{padding:20px}

    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    @media(max-width:768px){.grid-2{grid-template-columns:1fr}}

    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:12px 16px;font-size:12px;font-weight:600;color:var(--gray-500);text-transform:uppercase;background:var(--gray-50)}
    td{padding:12px 16px;border-top:1px solid var(--gray-200);font-size:14px}
    tr:hover{background:var(--gray-50)}
    .badge{display:inline-flex;padding:2px 10px;border-radius:9999px;font-size:12px;font-weight:500}
    .badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}
    .badge-yellow{background:#fef3c7;color:#92400e}.badge-blue{background:#dbeafe;color:#1e40af}
    .badge-gray{background:var(--gray-100);color:var(--gray-600)}

    .progress-bar{width:100%;height:8px;background:var(--gray-200);border-radius:9999px;overflow:hidden}
    .progress-bar .fill{height:100%;border-radius:9999px;transition:width .3s}

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
    .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
    .modal h2{font-size:18px;font-weight:700;margin-bottom:16px}
    .modal-actions{display:flex;gap:8px;margin-top:16px}

    .rec-item{padding:12px;border-radius:8px;margin-bottom:8px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
    .rec-item.info{background:#eff6ff;color:#1e40af}.rec-item.warn{background:#fffbeb;color:#92400e}
    .rec-item.danger{background:#fef2f2;color:#991b1b}.rec-item.success{background:#ecfdf5;color:#065f46}

    .chart-container{position:relative;height:300px}
    .empty-state{text-align:center;padding:48px 20px;color:var(--gray-400)}
    .empty-state .icon{font-size:48px;margin-bottom:12px}

    .flex-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .flex-gap{display:flex;gap:8px;flex-wrap:wrap}
    .filter-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
    .pagination{display:flex;justify-content:center;gap:4px;margin-top:16px}
    .pagination button{padding:6px 12px;border:1px solid var(--gray-300);border-radius:6px;background:#fff;font-size:13px}
    .pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  </style>
</head>
<body>
  <div id="app"></div>

<script>
// ===== DATA SERVICE (localStorage) =====
const DB = {
  get(key){ return JSON.parse(localStorage.getItem('fa_' + key) || '[]'); },
  set(key, val){ localStorage.setItem('fa_' + key, JSON.stringify(val)); },
  getOne(key){ return JSON.parse(localStorage.getItem('fa_' + key) || 'null'); },
  setOne(key, val){ localStorage.setItem('fa_' + key, JSON.stringify(val)); },
  genId(){ return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }
};

// ===== DEFAULT CATEGORIES =====
const DEFAULT_EXPENSE_CATS = [
  {name:'Vivienda',icon:'🏠',color:'#3B82F6'},{name:'Alimentación',icon:'🛒',color:'#10B981'},
  {name:'Transporte',icon:'🚗',color:'#F59E0B'},{name:'Combustible',icon:'⛽',color:'#EF4444'},
  {name:'Servicios básicos',icon:'💡',color:'#8B5CF6'},{name:'Internet y telefonía',icon:'📱',color:'#06B6D4'},
  {name:'Salud',icon:'🏥',color:'#EC4899'},{name:'Educación',icon:'📚',color:'#14B8A6'},
  {name:'Deudas',icon:'💳',color:'#F97316'},{name:'Seguros',icon:'🛡️',color:'#6366F1'},
  {name:'Entretenimiento',icon:'🎬',color:'#E11D48'},{name:'Compras personales',icon:'🛍️',color:'#A855F7'},
  {name:'Tecnología',icon:'💻',color:'#2563EB'},{name:'Vehículo',icon:'🔧',color:'#78716C'},
  {name:'Trabajo',icon:'💼',color:'#059669'},{name:'Negocio',icon:'🏢',color:'#0891B2'},
  {name:'Familia',icon:'👨‍👩‍👧‍👦',color:'#DB2777'},{name:'Otros gastos',icon:'📦',color:'#6B7280'},
];
const DEFAULT_INCOME_CATS = [
  {name:'Sueldo',icon:'💰',color:'#10B981'},{name:'Trabajo independiente',icon:'🎯',color:'#3B82F6'},
  {name:'Negocio',icon:'🏢',color:'#8B5CF6'},{name:'Trabajo ocasional',icon:'📋',color:'#F59E0B'},
  {name:'Otros ingresos',icon:'💵',color:'#6B7280'},
];

// ===== AUTH =====
function registerUser(name, email, password){
  const users = DB.get('users');
  if(users.find(u=>u.email===email)) throw new Error('Email ya registrado');
  const user = {id:DB.genId(), name, email, password, currency:'USD', created_at:new Date().toISOString()};
  users.push(user); DB.set('users', users);
  const cats = [...DEFAULT_EXPENSE_CATS.map(c=>({...c,type:'EXPENSE',id:DB.genId(),user_id:user.id})),
                ...DEFAULT_INCOME_CATS.map(c=>({...c,type:'INCOME',id:DB.genId(),user_id:user.id}))];
  DB.set('categories_'+user.id, cats);
  createDemoData(user.id);
  DB.setOne('current_user', {id:user.id,name:user.name,email:user.email,currency:user.currency});
  return DB.getOne('current_user');
}

function loginUser(email, password){
  const users = DB.get('users');
  const user = users.find(u=>u.email===email && u.password===password);
  if(!user) throw new Error('Email o contraseña inválidos');
  DB.setOne('current_user', {id:user.id,name:user.name,email:user.email,currency:user.currency});
  return DB.getOne('current_user');
}

function getCurrentUser(){ return DB.getOne('current_user'); }
function logout(){ localStorage.removeItem('fa_current_user'); }

// ===== DEMO DATA =====
function createDemoData(userId){
  const accounts = [
    {id:DB.genId(),user_id:userId,name:'Banco Principal',type:'BANK',current_balance:2450,currency:'USD'},
    {id:DB.genId(),user_id:userId,name:'Efectivo',type:'CASH',current_balance:320,currency:'USD'},
    {id:DB.genId(),user_id:userId,name:'Tarjeta de Crédito',type:'CREDIT_CARD',current_balance:-850,currency:'USD'},
  ];
  DB.set('accounts_'+userId, accounts);

  const cats = DB.get('categories_'+userId);
  const expCats = cats.filter(c=>c.type==='EXPENSE');
  const incCats = cats.filter(c=>c.type==='INCOME');
  const txs = [];
  const now = new Date();

  for(let m=0; m<6; m++){
    const d = new Date(now.getFullYear(), now.getMonth()-m, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

    const sal = incCats.find(c=>c.name==='Sueldo');
    if(sal) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[0].id,category_id:sal.id,type:'INCOME',amount:1500+Math.random()*500,description:'Salario mensual',date:`${ym}-01`,classification:'NECESSARY',is_recurring:false,is_business:'PERSONAL'});

    const viv = expCats.find(c=>c.name==='Vivienda');
    if(viv) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[0].id,category_id:viv.id,type:'EXPENSE',amount:400,description:'Alquiler',date:`${ym}-05`,classification:'NECESSARY',is_recurring:true,is_business:'PERSONAL'});

    const ali = expCats.find(c=>c.name==='Alimentación');
    if(ali) for(let i=0;i<8;i++) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[1].id,category_id:ali.id,type:'EXPENSE',amount:25+Math.random()*40,description:'Supermercado',date:`${ym}-${String(3+i*3).padStart(2,'0')}`,classification:'NECESSARY',is_recurring:false,is_business:'PERSONAL'});

    const tra = expCats.find(c=>c.name==='Transporte');
    if(tra) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[1].id,category_id:tra.id,type:'EXPENSE',amount:80+Math.random()*40,description:'Transporte mensual',date:`${ym}-10`,classification:'NECESSARY',is_recurring:false,is_business:'PERSONAL'});

    const ser = expCats.find(c=>c.name==='Servicios básicos');
    if(ser) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[0].id,category_id:ser.id,type:'EXPENSE',amount:60+Math.random()*30,description:'Servicios públicos',date:`${ym}-15`,classification:'NECESSARY',is_recurring:true,is_business:'PERSONAL'});

    const ent = expCats.find(c=>c.name==='Entretenimiento');
    if(ent) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[2].id,category_id:ent.id,type:'EXPENSE',amount:50+Math.random()*100,description:'Cine y ocio',date:`${ym}-20`,classification:'DISCRETIONARY',is_recurring:false,is_business:'PERSONAL'});

    const net = expCats.find(c=>c.name==='Internet y telefonía');
    if(net) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[0].id,category_id:net.id,type:'EXPENSE',amount:45,description:'Internet y móvil',date:`${ym}-08`,classification:'NECESSARY',is_recurring:true,is_business:'PERSONAL'});

    if(m%2===0){const sal2=expCats.find(c=>c.name==='Salud');if(sal2)txs.push({id:DB.genId(),user_id:userId,account_id:accounts[0].id,category_id:sal2.id,type:'EXPENSE',amount:30+Math.random()*50,description:'Farmacia',date:`${ym}-12`,classification:'NECESSARY',is_recurring:false,is_business:'PERSONAL'});}

    const negI = incCats.find(c=>c.name==='Negocio');
    if(negI && m<3) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[0].id,category_id:negI.id,type:'INCOME',amount:200+Math.random()*300,description:'Ventas negocio',date:`${ym}-25`,classification:'NECESSARY',is_recurring:false,is_business:'BUSINESS'});

    const negE = expCats.find(c=>c.name==='Negocio');
    if(negE && m<3) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[2].id,category_id:negE.id,type:'EXPENSE',amount:100+Math.random()*150,description:'Suministros negocio',date:`${ym}-18`,classification:'BUSINESS',is_recurring:false,is_business:'BUSINESS'});

    const comp = expCats.find(c=>c.name==='Compras personales');
    if(comp) for(let i=0;i<5;i++) txs.push({id:DB.genId(),user_id:userId,account_id:accounts[1].id,category_id:comp.id,type:'EXPENSE',amount:3+Math.random()*7,description:'Compra pequeña',date:`${ym}-${String(5+i*4).padStart(2,'0')}`,classification:'DISCRETIONARY',is_recurring:false,is_business:'PERSONAL'});
  }
  DB.set('transactions_'+userId, txs);

  const budgets = [
    {id:DB.genId(),user_id:userId,category_id:expCats.find(c=>c.name==='Alimentación')?.id,month:now.getMonth()+1,year:now.getFullYear(),amount:350,warning_threshold:80},
    {id:DB.genId(),user_id:userId,category_id:expCats.find(c=>c.name==='Transporte')?.id,month:now.getMonth()+1,year:now.getFullYear(),amount:150,warning_threshold:80},
    {id:DB.genId(),user_id:userId,category_id:expCats.find(c=>c.name==='Entretenimiento')?.id,month:now.getMonth()+1,year:now.getFullYear(),amount:150,warning_threshold:80},
    {id:DB.genId(),user_id:userId,category_id:expCats.find(c=>c.name==='Vivienda')?.id,month:now.getMonth()+1,year:now.getFullYear(),amount:450,warning_threshold:80},
  ];
  DB.set('budgets_'+userId, budgets);
}

// ===== FINANCIAL ENGINE =====
function getMonthTxs(userId, month, year, type){
  const txs = DB.get('transactions_'+userId);
  return txs.filter(t=>{
    const d = new Date(t.date);
    return d.getMonth()+1===month && d.getFullYear()===year && (!type || t.type===type);
  });
}
function sumAmount(txs){ return txs.reduce((s,t)=>s+Number(t.amount),0); }
function fmt(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n); }
function pct(a,b){ return b>0?((a/b)*100):0; }

function getDashboardData(userId, month, year){
  const incomes = getMonthTxs(userId,month,year,'INCOME');
  const expenses = getMonthTxs(userId,month,year,'EXPENSE');
  const totalInc = sumAmount(incomes);
  const totalExp = sumAmount(expenses);
  const balance = totalInc - totalExp;
  const savingsRate = pct(balance, totalInc);

  const cats = DB.get('categories_'+userId);
  const expByCat = {};
  expenses.forEach(t=>{
    if(!expByCat[t.category_id]) expByCat[t.category_id]=0;
    expByCat[t.category_id]+=Number(t.amount);
  });
  const distribution = Object.entries(expByCat).map(([catId,amount])=>{
    const cat = cats.find(c=>c.id===catId);
    return {name:cat?.name||'?',amount,color:cat?.color||'#6B7280',icon:cat?.icon};
  }).sort((a,b)=>b.amount-a.amount);

  const monthlyTrend = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const m=d.getMonth()+1, y=d.getFullYear();
    const inc=sumAmount(getMonthTxs(userId,m,y,'INCOME'));
    const exp=sumAmount(getMonthTxs(userId,m,y,'EXPENSE'));
    monthlyTrend.push({month:d.toLocaleDateString('es',{month:'short',year:'2-digit'}),income:inc,expenses:exp,savings:inc-exp});
  }

  const smallExpenses = expenses.filter(t=>Number(t.amount)<10);
  const recommendations = [];
  if(totalExp>totalInc) recommendations.push({type:'danger',text:'Tus gastos superaron tus ingresos este período.'});
  if(savingsRate<10 && totalInc>0) recommendations.push({type:'warn',text:`Tu tasa de ahorro es ${savingsRate.toFixed(1)}%. Intenta reducir gastos discrecionales.`});
  distribution.forEach(d=>{
    if(totalInc>0 && (d.amount/totalInc)*100>30) recommendations.push({type:'info',text:`"${d.name}" representa el ${((d.amount/totalInc)*100).toFixed(0)}% de tus ingresos. Revisa si puede reducirirse.`});
  });
  if(smallExpenses.length>5) recommendations.push({type:'warn',text:`${smallExpenses.length} gastos pequeños sumaron ${fmt(smallExpenses.reduce((s,t)=>s+Number(t.amount),0))}. Aunque cada uno es pequeño, en conjunto son significativos.`});
  if(recommendations.length===0 && totalInc>0) recommendations.push({type:'success',text:'Tu situación financiera se ve saludable. ¡Sigue así!'});

  return {totalIncome:totalInc,totalExpenses:totalExp,balance,savingsRate:décimal(savingsRate),distribution,monthlyTrend,recommendations,smallExpenses:{count:smallExpenses.length,total:sumAmount(smallExpenses)}};
}
function décimal(n){ return Math.round(n*100)/100; }

function getAnalysisData(userId, month, year){
  const data = getDashboardData(userId, month, year);
  const txs = getMonthTxs(userId, month, year, 'EXPENSE');
  const fixed = txs.filter(t=>t.is_recurring);
  const totalFixed = sumAmount(fixed);
  const totalVariable = data.totalExpenses - totalFixed;
  const cats = DB.get('categories_'+userId);

  const distribution = data.distribution.map(d=>{
    const catTxs = txs.filter(t=>t.category_id===cats.find(c=>c.name===d.name)?.id);
    return {...d,
      percentageOfExpenses:pct(d.amount,data.totalExpenses),
      percentageOfIncome:pct(d.amount,data.totalIncome),
      transactionCount:catTxs.length
    };
  });

  const unusualExpenses = [];
  const now = new Date();
  if(distribution.length>0){
    distribution.forEach(cat=>{
      const histAmounts = [];
      for(let i=1;i<=3;i++){
        const d2=new Date(now.getFullYear(),now.getMonth()-i,1);
        const mTxs=getMonthTxs(userId,d2.getMonth()+1,d2.getFullYear(),'EXPENSE');
        const catId=cats.find(c=>c.name===cat.name)?.id;
        const amt=mTxs.filter(t=>t.category_id===catId).reduce((s,t)=>s+Number(t.amount),0);
        if(amt>0) histAmounts.push(amt);
      }
      if(histAmounts.length>=2){
        const avg=histAmounts.reduce((s,a)=>s+a,0)/histAmounts.length;
        if(cat.amount>avg*1.2){
          unusualExpenses.push({category:cat.name,current:cat.amount,average:avg,percentage:Math.round(((cat.amount-avg)/avg)*100),message:`Gasto ${Math.round(((cat.amount-avg)/avg)*100)}% por encima del promedio histórico`});
        }
      }
    });
  }

  return {...data,totalFixed,totalVariable,availableBeforeVariable:data.totalIncome-totalFixed,distribution,unusualExpenses};
}

function getBudgetData(userId, month, year){
  const budgets = DB.get('budgets_'+userId).filter(b=>b.month===month && b.year===year);
  const cats = DB.get('categories_'+userId);
  const now = new Date();
  return budgets.map(b=>{
    const cat=cats.find(c=>c.id===b.category_id);
    const txs=getMonthTxs(userId,month,year,'EXPENSE').filter(t=>t.category_id===b.category_id);
    const spent=sumAmount(txs);
    const percentage=b.amount>0?(spent/b.amount)*100:0;
    let status='NORMAL'; if(percentage>=100)status='EXCEEDED'; else if(percentage>=b.warning_threshold)status='WARNING';
    return {...b,category:cat,spent,available:b.amount-spent,percentage:Math.round(percentage*100)/100,status};
  });
}

function updateAccountBalance(userId){
  const accs=DB.get('accounts_'+userId);const txs=DB.get('transactions_'+userId);
  accs.forEach(a=>{
    let bal=0;
    txs.filter(t=>t.account_id===a.id).forEach(t=>{
      if(t.type==='INCOME')bal+=Number(t.amount);else if(t.type==='EXPENSE')bal-=Number(t.amount);
    });
    a.current_balance=Number(a.initial_balance||0)+bal;
  });
  DB.set('accounts_'+userId,accs);
}

      <h2>Transferir</h2>
      <form id="tfr-form">
        <div class="form-group"><label>Desde</label><select id="tfr-from" required><option value="">Seleccionar</option>${accs.map(a=>`<option value="${a.id}">${a.name} (${fmt(Number(a.current_balance))})</option>`).join('')}</select></div>
        <div class="form-group"><label>Hacia</label><select id="tfr-to" required><option value="">Seleccionar</option>${accs.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
        <div class="form-group"><label>Monto</label><input type="number" step="0.01" min="0" id="tfr-amount" required></div>
        <div class="form-group"><label>Descripción</label><input type="text" id="tfr-desc"></div>
        <div class="modal-actions"><button type="submit" class="btn btn-purple">Transferir</button><button type="button" class="btn btn-outline" onclick="document.getElementById('tf-modal').remove()">Cancelar</button></div>
      </form>
    </div></div>`);
  document.getElementById('tfr-form').onsubmit=e=>{
    e.preventDefault();
    const user=getCurrentUser();const accs=DB.get('accounts_'+user.id);
    const fromId=document.getElementById('tfr-from').value;const toId=document.getElementById('tfr-to').value;
    const amount=parseFloat(document.getElementById('tfr-amount').value);
    if(fromId===toId){alert('Selecciona cuentas diferentes');return;}
    const from=accs.find(a=>a.id===fromId);const to=accs.find(a=>a.id===toId);
    if(Number(from.current_balance)<amount){alert('Saldo insuficiente');return;}
    from.current_balance=Number(from.current_balance)-amount;
    to.current_balance=Number(to.current_balance)+amount;
    DB.set('accounts_'+user.id,accs);document.getElementById('tf-modal').remove();renderPage(user);
  };
}

// ===== BUDGET =====
function renderBudget(user){
  const data=getBudgetData(user.id,currentPeriod.month,currentPeriod.year);
  const totalBud=data.reduce((s,b)=>s+b.amount,0);const totalSp=data.reduce((s,b)=>s+b.spent,0);
  document.getElementById('page-content').innerHTML = `
    <div class="flex-between" style="margin-bottom:24px">
      <div><h1 style="font-size:24px;font-weight:700">Presupuesto</h1><p style="font-size:14px;color:var(--gray-500)">${fmt(totalSp)} de ${fmt(totalBud)} utilizado</p></div>
      <div class="flex-gap">
        ${periodSelector()}
        <button class="btn btn-primary btn-sm" onclick="openBudgetForm()">+ Presupuesto</button>
      </div>
    </div>
    ${data.length===0?'<div class="card"><div class="card-body empty-state"><div class="icon">🎯</div><p>No hay presupuestos para este mes</p></div></div>':`
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Categoría</th><th style="text-align:right">Presupuesto</th><th style="text-align:right">Gastado</th><th style="text-align:right">Disponible</th><th>Progreso</th><th style="text-align:center">Estado</th><th style="text-align:center">Acciones</th></tr></thead>
          <tbody>${data.map(b=>`<tr>
            <td><span style="margin-right:8px">${b.category?.icon}</span>${b.category?.name||'?'}</td>
            <td style="text-align:right">${fmt(b.amount)}</td>
            <td style="text-align:right;font-weight:600">${fmt(b.spent)}</td>
            <td style="text-align:right">${fmt(b.available)}</td>
            <td><div class="progress-bar"><div class="fill" style="width:${Math.min(b.percentage,100)}%;background:${b.status==='EXCEEDED'?'var(--danger)':b.status==='WARNING'?'var(--warning)':'var(--success)'}"></div></div><span style="font-size:12px;color:var(--gray-500)">${b.percentage.toFixed(0)}%</span></td>
            <td style="text-align:center"><span class="badge ${b.status==='EXCEEDED'?'badge-red':b.status==='WARNING'?'badge-yellow':'badge-green'}">${b.status==='EXCEEDED'?'Excedido':b.status==='WARNING'?'Advertencia':'Normal'}</span></td>
            <td style="text-align:center"><button class="btn btn-outline btn-sm" onclick="deleteBudget('${b.id}')">🗑️</button></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`}`;
}
function openBudgetForm(){
  const user=getCurrentUser();const cats=DB.get('categories_'+user.id).filter(c=>c.type==='EXPENSE');
  const existing=DB.get('budgets_'+user.id).filter(b=>b.month===currentPeriod.month&&b.year===currentPeriod.year).map(b=>b.category_id);
  const available=cats.filter(c=>!existing.includes(c.id));
  document.getElementById('app').insertAdjacentHTML('beforeend',`
    <div class="modal-overlay" id="bud-modal"><div class="modal">
      <h2>Nuevo Presupuesto</h2>
      <form id="bud-form">
        <div class="form-group"><label>Categoría</label><select id="bf-cat" required><option value="">Seleccionar</option>${available.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select></div>
        <div class="form-group"><label>Monto máximo</label><input type="number" step="0.01" min="0" id="bf-amount" required></div>
        <div class="form-group"><label>% Advertencia</label><input type="number" min="1" max="100" id="bf-warn" value="80"></div>
        <div class="modal-actions"><button type="submit" class="btn btn-primary">Crear</button><button type="button" class="btn btn-outline" onclick="document.getElementById('bud-modal').remove()">Cancelar</button></div>
      </form>
    </div></div>`);
  document.getElementById('bud-form').onsubmit=e=>{
    e.preventDefault();const user=getCurrentUser();const budgets=DB.get('budgets_'+user.id);
    budgets.push({id:DB.genId(),user_id:user.id,category_id:document.getElementById('bf-cat').value,month:currentPeriod.month,year:currentPeriod.year,amount:parseFloat(document.getElementById('bf-amount').value),warning_threshold:parseFloat(document.getElementById('bf-warn').value)||80});
    DB.set('budgets_'+user.id,budgets);document.getElementById('bud-modal').remove();renderPage(user);
  };
}
function deleteBudget(id){if(!confirm('¿Eliminar?'))return;const user=getCurrentUser();let b=DB.get('budgets_'+user.id);b=b.filter(x=>x.id!==id);DB.set('budgets_'+user.id,b);renderPage(user);}

// ===== ANALYSIS =====
function renderAnalysis(user){
  const d=getAnalysisData(user.id,currentPeriod.month,currentPeriod.year);
  document.getElementById('page-content').innerHTML = `
    <div class="flex-between" style="margin-bottom:24px">
      <h1 style="font-size:24px;font-weight:700">Análisis Financiero</h1>
      ${periodSelector()}
    </div>
    <div class="stat-cards">
      <div class="stat-card orange"><div class="label">Gastos Fijos</div><div class="value" style="color:var(--warning)">${fmt(d.totalFixed)}</div><div class="sub">${d.totalIncome>0?Math.round((d.totalFixed/d.totalIncome)*100):0}% de ingresos</div></div>
      <div class="stat-card blue"><div class="label">Gastos Variables</div><div class="value">${fmt(d.totalVariable)}</div></div>
      <div class="stat-card green"><div class="label">Disponible antes de variables</div><div class="value" style="color:${d.availableBeforeVariable>=0?'var(--success)':'var(--danger)'}">${fmt(d.availableBeforeVariable)}</div></div>
    </div>
    <div class="grid-2" style="margin-bottom:24px">
      <div class="card"><div class="card-header"><h2>Distribución de Gastos</h2></div><div class="card-body"><div class="chart-container"><canvas id="ana-pie"></canvas></div></div></div>
      <div class="card"><div class="card-header"><h2>Evolución Mensual</h2></div><div class="card-body"><div class="chart-container"><canvas id="ana-line"></canvas></div></div></div>
    </div>
    <div class="card" style="margin-bottom:24px"><div class="card-header"><h2>Gastos por Categoría (% de ingresos)</h2></div><div class="card-body"><div class="chart-container" style="height:400px"><canvas id="ana-bar"></canvas></div></div></div>
    <div class="card" style="margin-bottom:24px"><div class="card-header"><h2>Detalle por Categoría</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Categoría</th><th style="text-align:right">Monto</th><th style="text-align:right">% Gastos</th><th style="text-align:right">% Ingresos</th><th style="text-align:center">Transacciones</th></tr></thead>
        <tbody>${d.distribution.map(c=>`<tr><td><span style="margin-right:8px">${c.icon}</span>${c.name}</td><td style="text-align:right;font-weight:600">${fmt(c.amount)}</td><td style="text-align:right">${c.percentageOfExpenses.toFixed(1)}%</td><td style="text-align:right;${c.percentageOfIncome>30?'color:var(--danger);font-weight:700':''}">${c.percentageOfIncome.toFixed(1)}%</td><td style="text-align:center;color:var(--gray-500)">${c.transactionCount}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>
    ${d.unusualExpenses.length>0?`<div class="card"><div class="card-header"><h2>Gastos Inusuales Detectados</h2></div><div class="card-body">${d.unusualExpenses.map(a=>`<div class="rec-item danger"><span>⚠️</span><div><strong>${fmt(a.current)} este mes vs promedio de ${fmt(a.average)}</strong><br><span style="font-size:13px">${a.message}</span></div></div>`).join('')}</div></div>`:''}`;

  if(d.distribution.length>0){
    charts.anaPie=new Chart(document.getElementById('ana-pie'),{type:'doughnut',data:{labels:d.distribution.map(c=>c.name),datasets:[{data:d.distribution.map(c=>c.amount),backgroundColor:d.distribution.map(c=>c.color)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12,padding:6,font:{size:11}}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmt(ctx.raw)}`}}}}});
  }
  charts.anaLine=new Chart(document.getElementById('ana-line'),{type:'line',data:{labels:d.monthlyTrend.map(m=>m.month),datasets:[{label:'Ingresos',data:d.monthlyTrend.map(m=>m.income),borderColor:'#10B981',backgroundColor:'#10B981',tension:.3},{label:'Gastos',data:d.monthlyTrend.map(m=>m.expenses),borderColor:'#EF4444',backgroundColor:'#EF4444',tension:.3},{label:'Ahorro',data:d.monthlyTrend.map(m=>m.savings),borderColor:'#3B82F6',backgroundColor:'#3B82F6',tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.raw)}`}}}}});
  charts.anaBar=new Chart(document.getElementById('ana-bar'),{type:'bar',data:{labels:d.distribution.map(c=>c.name),datasets:[{label:'% de Ingresos',data:d.distribution.map(c=>c.percentageOfIncome),backgroundColor:d.distribution.map(c=>c.color)}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:ctx=>`${ctx.raw.toFixed(1)}%`}}},scales:{x:{max:100,ticks:{callback:v=>v+'%'}}}}});
}

// ===== INIT =====
render();
</script>
</body>
</html>
